name: Release

# Cuts per-image releases from Conventional Commits and publishes the released images.
# The release PR is opened by release-please; merging it creates the tags and GitHub releases,
# and the images that were released are then built, scanned and pushed to the registry.
on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags and releases
      pull-requests: write # release PR
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: read
      security-events: write # upload Trivy results
      id-token: write # keyless cosign signing
    uses: ./.github/workflows/docker-build.yml
    with:
      publish: true
      paths: ${{ needs.release-please.outputs.paths_released }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
