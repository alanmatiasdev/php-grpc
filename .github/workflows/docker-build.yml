name: Docker Build & Push

on:
  push:
    branches:
      - main
      - master
    paths:
      - "8.2/**"
      - "8.3/**"
      - "8.4/**"
      - ".github/images.json"
      - ".github/scripts/**"
      - ".github/workflows/docker-build.yml"
      - ".hadolint.yaml"
      - ".trivyignore"
  pull_request:
    paths:
      - "8.2/**"
      - "8.3/**"
      - "8.4/**"
      - ".github/images.json"
      - ".github/scripts/**"
      - ".github/workflows/docker-build.yml"
      - ".hadolint.yaml"
      - ".trivyignore"
  schedule:
    # Weekly rebuild of every image to pick up base image patches
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build matrix
        id: build-matrix
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # Scheduled and manual runs rebuild everything; so does a push without a usable previous commit
          ALL=false
          case "$EVENT" in
            schedule|workflow_dispatch) ALL=true ;;
            pull_request) CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD") ;;
            *)
              if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                ALL=true
              else
                CHANGED=$(git diff --name-only "$BEFORE" HEAD)
              fi
              ;;
          esac

          # A change to the build tooling itself rebuilds everything
          if [[ "$ALL" == false ]] && grep -qE '^(\.github/|\.hadolint\.yaml|\.trivyignore)' <<< "$CHANGED"; then
            ALL=true
          fi

          if [[ "$ALL" == true ]]; then
            MATRIX=$(jq -c '{include: .}' .github/images.json)
          else
            MATRIX=$(jq -c --argjson changed "$(jq -Rsc 'split("\n") | map(select(length > 0))' <<< "$CHANGED")" '
              {include: [ .[] | select(.dir as $d | any($changed[]; startswith($d + "/"))) ]}
            ' .github/images.json)
          fi

          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          jq . <<< "$MATRIX"

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload Trivy results
      id-token: write # keyless cosign signing
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    env:
      LOCAL_IMAGE: php-grpc:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dir }}/Dockerfile
          config: .hadolint.yaml

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.dir }}
          file: ${{ matrix.dir }}/Dockerfile
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,scope=${{ matrix.tag }},mode=max

      - name: Smoke test
        env:
          DIR: ${{ matrix.dir }}
        run: .github/scripts/smoke-test.sh "$LOCAL_IMAGE" "$DIR"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Upload Trivy results
        if: ${{ !cancelled() && github.event_name != 'pull_request' && hashFiles('trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.tag }}

      # Everything below only runs once the image built, passed its smoke test and the scan
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve tags
        if: github.event_name != 'pull_request'
        id: tags
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/php-grpc
          DIR: ${{ matrix.dir }}
          TAG: ${{ matrix.tag }}
        run: |
          TAGS="${IMAGE}:${TAG}"

          # Pinned base images (php:X.Y.Z-...) also get a full-version tag, e.g. 8.2.35-fpm
          VERSION=$(sed -nE 's/^FROM php:([0-9]+\.[0-9]+\.[0-9]+)-.*/\1/p' "${DIR}/Dockerfile")
          if [[ -n "$VERSION" ]]; then
            TAGS+=$'\n'"${IMAGE}:${VERSION}-${TAG#*-}"
          fi

          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
            echo "image=${IMAGE}"
          } >> "$GITHUB_OUTPUT"

      - name: Push image
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.dir }}
          file: ${{ matrix.dir }}/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.tag }}

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
