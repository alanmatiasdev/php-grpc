name: Docker Build & Push

on:
  push:
    branches:
      - main
      - master
    paths:
      - "8.2/**"
      - "8.3/**"
      - "8.4/**"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            fpm_82:
              - "8.2/fpm/**"
            fpm_alpine_82:
              - "8.2/fpm-alpine/**"
            cli_alpine_82:
              - "8.2/cli-alpine/**"
            test_runner_82:
              - "8.2/test-runner/**"
            fpm_83:
              - "8.3/fpm/**"
            fpm_alpine_83:
              - "8.3/fpm-alpine/**"
            cli_alpine_83:
              - "8.3/cli-alpine/**"
            test_runner_83:
              - "8.3/test-runner/**"
            fpm_84:
              - "8.4/fpm/**"
            fpm_alpine_84:
              - "8.4/fpm-alpine/**"
            cli_alpine_84:
              - "8.4/cli-alpine/**"
            test_runner_84:
              - "8.4/test-runner/**"

      - name: Build matrix
        id: build-matrix
        run: |
          INCLUDES=()

          [[ "${{ steps.filter.outputs.fpm_82 }}"          == "true" ]] && INCLUDES+=('{"dir":"8.2/fpm","tag":"8.2-fpm"}')
          [[ "${{ steps.filter.outputs.fpm_alpine_82 }}"   == "true" ]] && INCLUDES+=('{"dir":"8.2/fpm-alpine","tag":"8.2-fpm-alpine"}')
          [[ "${{ steps.filter.outputs.cli_alpine_82 }}"   == "true" ]] && INCLUDES+=('{"dir":"8.2/cli-alpine","tag":"8.2-cli-alpine3.21"}')
          [[ "${{ steps.filter.outputs.test_runner_82 }}"  == "true" ]] && INCLUDES+=('{"dir":"8.2/test-runner","tag":"8.2-test-runner"}')
          [[ "${{ steps.filter.outputs.fpm_83 }}"          == "true" ]] && INCLUDES+=('{"dir":"8.3/fpm","tag":"8.3-fpm"}')
          [[ "${{ steps.filter.outputs.fpm_alpine_83 }}"   == "true" ]] && INCLUDES+=('{"dir":"8.3/fpm-alpine","tag":"8.3-fpm-alpine"}')
          [[ "${{ steps.filter.outputs.cli_alpine_83 }}"   == "true" ]] && INCLUDES+=('{"dir":"8.3/cli-alpine","tag":"8.3-cli-alpine3.21"}')
          [[ "${{ steps.filter.outputs.test_runner_83 }}"  == "true" ]] && INCLUDES+=('{"dir":"8.3/test-runner","tag":"8.3-test-runner"}')
          [[ "${{ steps.filter.outputs.fpm_84 }}"          == "true" ]] && INCLUDES+=('{"dir":"8.4/fpm","tag":"8.4-fpm"}')
          [[ "${{ steps.filter.outputs.fpm_alpine_84 }}"   == "true" ]] && INCLUDES+=('{"dir":"8.4/fpm-alpine","tag":"8.4-fpm-alpine"}')
          [[ "${{ steps.filter.outputs.cli_alpine_84 }}"   == "true" ]] && INCLUDES+=('{"dir":"8.4/cli-alpine","tag":"8.4-cli-alpine3.21"}')
          [[ "${{ steps.filter.outputs.test_runner_84 }}"  == "true" ]] && INCLUDES+=('{"dir":"8.4/test-runner","tag":"8.4-test-runner"}')

          JOINED=$(IFS=,; echo "${INCLUDES[*]}")
          echo "matrix={\"include\":[${JOINED}]}" >> "$GITHUB_OUTPUT"

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}
          file: ${{ matrix.dir }}/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/php-grpc:${{ matrix.tag }}
