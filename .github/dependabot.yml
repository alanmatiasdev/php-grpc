version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /8.2/*
      - /8.3/*
      - /8.4/*
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      # Each directory tracks one PHP minor line; only patch releases should be proposed
      - dependency-name: php
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Node.js stays on the current LTS line until we move it on purpose
      - dependency-name: node
        update-types: ["version-update:semver-major"]
